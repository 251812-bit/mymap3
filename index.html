
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>마음 힐링 지도</title>

  <style>
    /* 전체 화면 기본 설정 */
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Malgun Gothic", sans-serif;
      color: #333;
    }

    /* 왼쪽 목록과 오른쪽 지도 배치 */
    .container {
      display: flex;
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }

    /* 왼쪽 사이드바 */
    .sidebar {
      display: flex;
      flex-direction: column;
      width: 360px;
      min-width: 300px;
      background: #fff;
      border-right: 1px solid #ddd;
      z-index: 2;
    }

    .header {
      padding: 24px 20px 16px;
    }

    .header h1 {
      margin: 0 0 8px;
      color: #55775d;
      font-size: 24px;
    }

    .header p {
      margin: 0;
      color: #777;
      font-size: 13px;
      line-height: 1.6;
    }

    /* 힐링 장소 탭 */
    .tab-container {
      display: flex;
      gap: 8px;
      padding: 0 20px 16px;
    }

    .tab-button {
      flex: 1;
      padding: 12px 8px;
      border: 1px solid #d8e3d8;
      border-radius: 9px;
      background: #fff;
      color: #55775d;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    .tab-button.active {
      background: #6e9275;
      color: white;
      border-color: #6e9275;
    }

    .tab-button:focus-visible,
    .tool-button:focus-visible {
      outline: 2px solid #375e40;
      outline-offset: 2px;
    }

    /* 검색 결과 제목 */
    .result-header {
      padding: 14px 20px;
      background: #f6f8f5;
      border-top: 1px solid #eee;
      border-bottom: 1px solid #eee;
      font-size: 14px;
      font-weight: bold;
    }

    /* 검색 결과 목록 */
    #resultList {
      flex: 1;
      overflow-y: auto;
    }

    .result-item {
      padding: 16px 20px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
    }

    .result-item:hover,
    .result-item:focus-visible {
      background: #f4f8f2;
    }

    .place-name {
      margin-bottom: 8px;
      font-size: 15px;
      font-weight: bold;
    }

    .place-category {
      margin-bottom: 7px;
      color: #6e9275;
      font-size: 12px;
    }

    .place-address {
      color: #666;
      font-size: 12px;
      line-height: 1.6;
    }

    .place-phone {
      margin-top: 5px;
      color: #888;
      font-size: 12px;
    }

    .message {
      padding: 24px 18px;
      color: #777;
      font-size: 13px;
      line-height: 1.8;
      text-align: center;
    }

    /* 오른쪽 지도 영역 */
    .map-area {
      position: relative;
      flex: 1;
      min-width: 0;
      background: #eee;
    }

    #map,
    #roadview {
      width: 100%;
      height: 100%;
    }

    /* 로드뷰는 처음에 숨김 */
    #roadview {
      display: none;
    }

    /* 지도 상단 안내 문구 */
    #mapStatus {
      position: absolute;
      top: 15px;
      left: 15px;
      z-index: 3;
      max-width: calc(100% - 30px);
      padding: 11px 14px;
      border-radius: 8px;
      background: white;
      box-shadow: 0 2px 8px #00000018;
      font-size: 13px;
      line-height: 1.5;
    }

    /* 지도 오른쪽 아래 기능 버튼 */
    .map-tools {
      position: absolute;
      right: 15px;
      bottom: 25px;
      z-index: 3;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .tool-button {
      padding: 12px 14px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: white;
      color: #333;
      font-size: 13px;
      cursor: pointer;
      box-shadow: 0 2px 8px #00000018;
    }

    .tool-button:hover {
      background: #f4f8f2;
    }

    .tool-button.active {
      background: #6e9275;
      color: white;
    }

    /* 작은 화면에서도 두 영역 유지 */
    @media (max-width: 600px) {
      .sidebar {
        width: 42%;
        min-width: 145px;
      }

      .header {
        padding: 16px 10px 12px;
      }

      .header h1 {
        font-size: 18px;
      }

      .header p {
        font-size: 11px;
      }

      .tab-container {
        padding: 0 8px 12px;
        gap: 5px;
      }

      .tab-button {
        padding: 10px 3px;
        font-size: 11px;
      }

      .result-header {
        padding: 12px 10px;
        font-size: 12px;
      }

      .result-item {
        padding: 13px 10px;
      }

      .place-name {
        font-size: 13px;
      }

      .place-address {
        font-size: 11px;
      }

      #mapStatus {
        top: 8px;
        left: 8px;
        font-size: 11px;
      }

      .map-tools {
        right: 8px;
        bottom: 12px;
      }

      .tool-button {
        padding: 10px 8px;
        font-size: 11px;
      }
    }
  </style>
</head>

<body>
  <div class="container">

    <!-- 왼쪽: 힐링 장소 탭과 결과 목록 -->
    <aside class="sidebar">

      <div class="header">
        <h1>마음 힐링 지도</h1>
        <p>
          지친 일상 속에서 잠시 쉬어 갈 수 있는
          공간을 찾아보세요.
        </p>
      </div>

      <!-- 탭을 선택하면 해당 유형의 장소 검색 -->
      <div class="tab-container">
        <button
          class="tab-button active"
          id="cafeTab"
          type="button"
          aria-pressed="true"
        >
          ☕ 힐링카페
        </button>

        <button
          class="tab-button"
          id="bookstoreTab"
          type="button"
          aria-pressed="false"
        >
          📚 힐링서점
        </button>
      </div>

      <div class="result-header" id="resultCount">
        주변 힐링 장소
      </div>

      <div id="resultList" aria-live="polite">
        <div class="message">
          현재 위치를 확인하고 있습니다.
        </div>
      </div>
    </aside>

    <!-- 오른쪽: 지도와 추가 기능 -->
    <main class="map-area">

      <div id="map"></div>
      <div id="roadview"></div>

      <div id="mapStatus" role="status">
        지도를 불러오는 중입니다.
      </div>

      <div class="map-tools">
        <button
          class="tool-button"
          id="locationButton"
          type="button"
        >
          📍 현재 위치
        </button>

        <button
          class="tool-button"
          id="roadviewButton"
          type="button"
          aria-pressed="false"
        >
          🛣️ 로드뷰 보기
        </button>

        <button
          class="tool-button"
          id="trafficButton"
          type="button"
          aria-pressed="false"
        >
          🚦 교통정보 켜기
        </button>
      </div>

    </main>
  </div>

  <!-- 카카오맵 SDK와 장소 검색 서비스 불러오기 -->
  <script
    src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=9a9ca10ee458752689c771ee79550911&libraries=services&autoload=false"
    onerror="showMapError()"
  ></script>

  <script>
    // 지도와 장소 검색에 필요한 변수
    let map;
    let placesService;
    let mapReady = false;
    let currentPosition = null;
    let currentTab = "cafe";
    let currentInfoWindow = null;
    let currentRoadview = null;
    let isRoadviewVisible = false;
    let isTrafficVisible = false;
    let searchRequestId = 0;

    // 여러 장소의 마커를 저장할 배열
    let markers = [];

    // HTML 요소 가져오기
    const cafeTab = document.getElementById("cafeTab");
    const bookstoreTab = document.getElementById("bookstoreTab");
    const resultList = document.getElementById("resultList");
    const resultCount = document.getElementById("resultCount");
    const mapStatus = document.getElementById("mapStatus");
    const locationButton = document.getElementById("locationButton");
    const roadviewButton = document.getElementById("roadviewButton");
    const trafficButton = document.getElementById("trafficButton");
    const mapElement = document.getElementById("map");
    const roadviewElement = document.getElementById("roadview");

    // 지도 SDK 로딩 오류 안내
    function showMapError() {
      mapStatus.textContent =
        "지도를 불러오지 못했습니다. API 키와 도메인 설정을 확인해 주세요.";

      resultCount.textContent = "지도 로딩 실패";

      resultList.innerHTML = "";

      const message = document.createElement("div");
      message.className = "message";
      message.textContent =
        "인터넷 연결, 카카오 JavaScript 키, 웹 플랫폼 도메인 설정을 확인해 주세요.";

      resultList.appendChild(message);
    }

    // SDK가 로드된 뒤 지도를 초기화
    window.addEventListener("load", function () {
      if (!window.kakao || !window.kakao.maps) {
        showMapError();
        return;
      }

      kakao.maps.load(function () {
        initializeMap();
      });
    });

    // 지도 생성
    function initializeMap() {
      try {
        // 현재 위치를 확인하기 전에는 서울시청을 기본 위치로 사용
        const defaultPosition = new kakao.maps.LatLng(
          37.5665,
          126.9780
        );

        map = new kakao.maps.Map(mapElement, {
          center: defaultPosition,
          level: 5
        });

        // 장소 검색 서비스 생성
        placesService = new kakao.maps.services.Places();

        // 지도 타일 로딩이 끝난 뒤 검색 실행 가능
        kakao.maps.event.addListener(
          map,
          "tilesloaded",
          function () {
            if (mapReady) return;

            mapReady = true;

            mapStatus.textContent =
              "지도 준비 완료 · 주변 힐링 장소를 찾고 있습니다.";

            // 현재 위치가 확인되었다면 주변 장소 검색
            if (currentPosition) {
              searchCurrentTab();
            }
          }
        );

        // 현재 위치 권한 요청
        requestCurrentLocation();

      } catch (error) {
        console.error("지도 초기화 오류:", error);
        showMapError();
      }
    }

    // 현재 위치 가져오기
    function requestCurrentLocation() {
      if (!navigator.geolocation) {
        useDefaultLocation();
        return;
      }

      mapStatus.textContent =
        "현재 위치 권한을 확인하고 있습니다.";

      navigator.geolocation.getCurrentPosition(
        function (position) {
          // 브라우저에서 전달받은 좌표
          currentPosition = new kakao.maps.LatLng(
            position.coords.latitude,
            position.coords.longitude
          );

          // 현재 위치를 지도 중심으로 설정
          map.setCenter(currentPosition);
          map.setLevel(5);

          mapStatus.textContent =
            "현재 위치를 확인했습니다.";

          // 지도가 준비된 상태라면 장소 검색
          if (mapReady) {
            searchCurrentTab();
          }
        },

        function (error) {
          // 위치 권한을 거부하거나 확인에 실패한 경우
          console.warn("현재 위치 확인 실패:", error);
          useDefaultLocation();
        },

        {
          enableHighAccuracy: false,
          timeout: 10000,
          maximumAge: 60000
        }
      );
    }

    // 현재 위치를 가져오지 못했을 때 기본 위치 사용
    function useDefaultLocation() {
      currentPosition = new kakao.maps.LatLng(
        37.5665,
        126.9780
      );

      map.setCenter(currentPosition);
      map.setLevel(5);

      mapStatus.textContent =
        "현재 위치를 사용할 수 없어 서울시청 주변을 표시합니다.";

      if (mapReady) {
        searchCurrentTab();
      }
    }

    // 현재 위치 버튼을 눌렀을 때 실행
    function moveToCurrentLocation() {
      if (!mapReady) {
        mapStatus.textContent =
          "지도가 준비될 때까지 기다려 주세요.";
        return;
      }

      // 위치 정보가 없다면 다시 요청
      if (!currentPosition) {
        requestCurrentLocation();
        return;
      }

      map.setCenter(currentPosition);
      map.setLevel(5);

      // 지도 중심을 이동한 뒤 현재 탭의 장소 다시 검색
      searchCurrentTab();
    }

    // 기존 마커와 정보창 제거
    function clearMarkers() {
      markers.forEach(function (marker) {
        marker.setMap(null);
      });

      markers = [];

      if (currentInfoWindow) {
        currentInfoWindow.close();
        currentInfoWindow = null;
      }
    }

    // 기존 검색 결과를 지우고 안내 문구 표시
    function clearResults(message) {
      resultList.innerHTML = "";

      const item = document.createElement("div");
      item.className = "message";
      item.textContent = message;

      resultList.appendChild(item);
    }

    // 탭에 맞는 장소 검색
    function searchCurrentTab() {
      if (!mapReady || !currentPosition || !placesService) {
        return;
      }

      // 이전 검색 응답이 나중에 도착해 결과를 덮어쓰지 않도록 구분
      const requestId = ++searchRequestId;

      // 탭을 바꾸면 기존 마커, 정보창, 목록 제거
      clearMarkers();

      resultCount.textContent = "검색 중...";
      clearResults("주변 힐링 장소를 검색하고 있습니다.");

      // 현재 위치를 중심으로 반경 5km 내 장소 검색
      const searchOptions = {
        location: currentPosition,
        radius: 5000,
        sort: kakao.maps.services.SortBy.DISTANCE
      };

      mapStatus.textContent =
        currentTab === "cafe"
          ? "주변 힐링카페를 찾고 있습니다."
          : "주변 힐링서점을 찾고 있습니다.";

      // 힐링카페는 카테고리 코드 CE7로 검색
      if (currentTab === "cafe") {
        placesService.categorySearch(
          "CE7",
          function (data, status, pagination) {
            handleSearchResults(
              data,
              status,
              pagination,
              requestId
            );
          },
          searchOptions
        );

      // 힐링서점은 '서점'이라는 검색어로 검색
      } else {
        placesService.keywordSearch(
          "서점",
          function (data, status, pagination) {
            handleSearchResults(
              data,
              status,
              pagination,
              requestId
            );
          },
          searchOptions
        );
      }
    }

    // 검색 결과 처리
    function handleSearchResults(
      data,
      status,
      pagination,
      requestId
    ) {
      // 이전 검색의 늦은 응답은 무시
      if (requestId !== searchRequestId) {
        return;
      }

      if (status === kakao.maps.services.Status.OK) {
        displayPlaces(data);

        mapStatus.textContent =
          "장소를 선택하면 지도에서 위치와 주소를 확인할 수 있습니다.";

      } else if (
        status === kakao.maps.services.Status.ZERO_RESULT
      ) {
        resultCount.textContent = "검색 결과 0개";

        clearResults(
          "주변에 검색 결과가 없습니다. 다른 탭을 선택하거나 위치를 확인해 주세요."
        );

        mapStatus.textContent = "주변 장소를 찾지 못했습니다.";

      } else {
        resultCount.textContent = "검색 실패";

        clearResults(
          "장소 검색에 실패했습니다. 잠시 후 다시 시도해 주세요."
        );

        mapStatus.textContent =
          "검색 중 오류가 발생했습니다.";
      }
    }

    // 검색 결과를 목록과 지도에 표시
    function displayPlaces(places) {
      clearMarkers();
      resultList.innerHTML = "";

      resultCount.textContent =
        "주변 장소 " + places.length + "개";

      if (places.length === 0) {
        clearResults("검색 결과가 없습니다.");
        return;
      }

      // 검색 결과 각각에 마커와 목록 생성
      places.forEach(function (place) {
        const placePosition = new kakao.maps.LatLng(
          Number(place.y),
          Number(place.x)
        );

        // 장소 마커 생성
        const marker = new kakao.maps.Marker({
          map: map,
          position: placePosition,
          title: place.place_name
        });

        markers.push(marker);

        // 마커를 누르면 장소 이름과 주소 표시
        kakao.maps.event.addListener(
          marker,
          "click",
          function () {
            showPlaceInfo(place, marker);
          }
        );

        // 왼쪽 목록에 장소 정보 생성
        const item = document.createElement("div");
        item.className = "result-item";
        item.tabIndex = 0;
        item.setAttribute("role", "button");
        item.setAttribute(
          "aria-label",
          place.place_name + " 지도에서 보기"
        );

        const name = document.createElement("div");
        name.className = "place-name";
        name.textContent = place.place_name;

        const category = document.createElement("div");
        category.className = "place-category";
        category.textContent =
          place.category_name || "힐링 장소";

        const address = document.createElement("div");
        address.className = "place-address";
        address.textContent =
          place.road_address_name ||
          place.address_name ||
          "주소 정보 없음";

        item.appendChild(name);
        item.appendChild(category);
        item.appendChild(address);

        // 목록을 누르면 지도 이동 및 정보창 표시
        item.addEventListener("click", function () {
          showPlaceInfo(place, marker);
        });

        // 키보드로도 장소 선택 가능
        item.addEventListener("keydown", function (event) {
          if (
            event.key === "Enter" ||
            event.key === " "
          ) {
            event.preventDefault();
            showPlaceInfo(place, marker);
          }
        });

        resultList.appendChild(item);
      });
    }

    // 선택한 장소의 이름과 주소를 팝업으로 표시
    function showPlaceInfo(place, marker) {
      const placePosition = marker.getPosition();

      // 선택한 장소가 지도 중심에 오도록 이동
      map.setCenter(placePosition);

      // 로드뷰가 켜져 있다면 지도 화면으로 돌아가기
      if (isRoadviewVisible) {
        toggleRoadview(false);
      }

      // 기존 정보창 닫기
      if (currentInfoWindow) {
        currentInfoWindow.close();
      }

      // 안전하게 HTML 요소를 만들어 장소 정보 표시
      const content = document.createElement("div");
      content.style.cssText =
        "padding:12px;max-width:240px;font-size:13px;line-height:1.6;";

      const name = document.createElement("strong");
      name.textContent = place.place_name;

      const address = document.createElement("div");
      address.style.cssText =
        "margin-top:5px;color:#666;";

      address.textContent =
        place.road_address_name ||
        place.address_name ||
        "주소 정보 없음";

      content.appendChild(name);
      content.appendChild(address);

      // 새 정보창 생성 및 표시
      currentInfoWindow = new kakao.maps.InfoWindow({
        content: content,
        removable: true
      });

      currentInfoWindow.open(map, marker);
    }

    // 힐링카페 탭 선택
    cafeTab.addEventListener("click", function () {
      currentTab = "cafe";

      cafeTab.classList.add("active");
      bookstoreTab.classList.remove("active");

      cafeTab.setAttribute("aria-pressed", "true");
      bookstoreTab.setAttribute("aria-pressed", "false");

      searchCurrentTab();
    });

    // 힐링서점 탭 선택
    bookstoreTab.addEventListener("click", function () {
      currentTab = "bookstore";

      bookstoreTab.classList.add("active");
      cafeTab.classList.remove("active");

      bookstoreTab.setAttribute("aria-pressed", "true");
      cafeTab.setAttribute("aria-pressed", "false");

      searchCurrentTab();
    });

    // 현재 위치 버튼 이벤트
    locationButton.addEventListener(
      "click",
      moveToCurrentLocation
    );

    // 로드뷰 버튼을 눌렀을 때 지도와 로드뷰 전환
    roadviewButton.addEventListener("click", function () {
      if (!mapReady) {
        mapStatus.textContent =
          "지도가 준비될 때까지 기다려 주세요.";
        return;
      }

      toggleRoadview(!isRoadviewVisible);
    });

    // 로드뷰 표시 또는 숨기기
    function toggleRoadview(show) {
      if (show) {
        // 현재 위치 주변의 로드뷰가 있는지 확인
        const roadviewClient =
          new kakao.maps.RoadviewClient();

        roadviewClient.getNearestPanoId(
          currentPosition,
          100,
          function (panoId) {
            if (!panoId) {
              mapStatus.textContent =
                "현재 위치 주변에서 로드뷰를 찾지 못했습니다.";
              return;
            }

            // 로드뷰 화면 생성
            if (!currentRoadview) {
              currentRoadview =
                new kakao.maps.Roadview(roadviewElement);
            }

            // 로드뷰 데이터 표시
            currentRoadview.setPanoId(
              panoId,
              currentPosition
            );

            mapElement.style.display = "none";
            roadviewElement.style.display = "block";

            isRoadviewVisible = true;

            roadviewButton.classList.add("active");
            roadviewButton.setAttribute(
              "aria-pressed",
              "true"
            );

            roadviewButton.textContent = "🗺️ 지도 보기";

            mapStatus.textContent =
              "로드뷰를 표시하고 있습니다.";
          }
        );

      } else {
        // 지도 화면으로 돌아가기
        roadviewElement.style.display = "none";
        mapElement.style.display = "block";

        isRoadviewVisible = false;

        roadviewButton.classList.remove("active");
        roadviewButton.setAttribute(
          "aria-pressed",
          "false"
        );

        roadviewButton.textContent = "🛣️ 로드뷰 보기";

        // 화면 크기 변경에 맞게 지도 크기 재조정
        map.relayout();

        if (currentPosition) {
          map.setCenter(currentPosition);
        }

        mapStatus.textContent =
          "지도를 표시하고 있습니다.";
      }
    }

    // 교통정보 표시 및 해제
    trafficButton.addEventListener("click", function () {
      if (!mapReady) {
        mapStatus.textContent =
          "지도가 준비될 때까지 기다려 주세요.";
        return;
      }

      // 현재 상태를 반대로 변경
      isTrafficVisible = !isTrafficVisible;

      if (isTrafficVisible) {
        map.addOverlayMapTypeId(
          kakao.maps.MapTypeId.TRAFFIC
        );

        trafficButton.classList.add("active");
        trafficButton.setAttribute(
          "aria-pressed",
          "true"
        );

        trafficButton.textContent = "🚦 교통정보 끄기";

        mapStatus.textContent =
          "교통정보를 표시했습니다.";

      } else {
        map.removeOverlayMapTypeId(
          kakao.maps.MapTypeId.TRAFFIC
        );

        trafficButton.classList.remove("active");
        trafficButton.setAttribute(
          "aria-pressed",
          "false"
        );

        trafficButton.textContent = "🚦 교통정보 켜기";

        mapStatus.textContent =
          "교통정보 표시를 해제했습니다.";
      }
    });
  </script>
</body>
</html>
